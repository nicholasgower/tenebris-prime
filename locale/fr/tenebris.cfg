[tips-and-tricks-item-name]
tenebris-briefing=Briefing sur Tenebris

[tips-and-tricks-item-description]
tenebris-briefing=[planet=tenebris] est une planète plongée dans l'obscurité éternelle, l'énergie solaire y est inutile et la vision nocturne ne fonctionne pas non plus. La planète est infestée de mille-pattes, ils sont robustes et venimeux, mais ne vous attaqueront pas à moins que vous ne les dérangiez. L’énergie de la planète repose sur la [item=luciferin], un composé permettant de créer des machines bioluminescentes qui n'ont pas besoin d'alimentation électrique pour fonctionner. Les capsules de fret peuvent rencontrer des défaillances de navigation en tentant d'atterrir sur cette planète, peut-être que la technologie que nous y découvrons pourra contourner ce problème ?\n\nVous devrez utiliser le [entity=bioinfusor] pour infuser les machines avec des propriétés bioluminescentes, leur permettant ainsi de fonctionner sans électricité.

