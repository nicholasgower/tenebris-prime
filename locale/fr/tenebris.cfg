[item-description]
luciferin=Une poudre bioluminescente émettant une douce lueur bleu-vert, utilisée pour les applications avancées en énergie et lumière.
lucifunnel=Une plante bioluminescente aux feuilles délicates en forme d’entonnoir, émettant une lueur bleu-vert éthérée. Ses vrilles enroulées et ses motifs de feuilles complexes créent un spectacle fascinant dans l'obscurité, rappelant les coraux sous-marins ou la flore extraterrestre. Le Lucifunnel prospère dans les environnements à faible luminosité, où il diffuse une lumière spectrale douce, attirant les pollinisateurs nocturnes et illuminant son environnement d'une aura mystique.
lucifunnel-seed=Une graine rare et lumineuse émettant une douce lueur bleu-vert, essentielle pour cultiver la flore bioluminescente.
quartz-ore=Un minéral cristallin brillant trouvé dans des gisements rocheux, prisé pour l'industrie et l'artisanat.
quartz-crystal=Un minéral transparent et vitreux aux facettes tranchantes, apprécié pour sa beauté et sa durabilité en industrie et artisanat.
chitin=Un matériau robuste issu des exosquelettes, connu pour sa résilience et sa durabilité.
tenecap=Un champignon brun terne.
tenecap-spore=Un petit amas de spores récoltées sur le champignon Tenecap.
chitosan=Un matériau raffiné et léger dérivé de la chitine, réputé pour sa flexibilité et sa résistance.
biobeacon=Balise infusée de puissance bioluminescente, accepte tous les modules qu’une balise standard peut contenir, en plus du [item=productivity-module].

