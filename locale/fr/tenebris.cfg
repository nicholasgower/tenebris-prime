[mod-name]
tenebris-prime=○🌐Tenebris Prime (trad by Fr_Dae)

[mod-description]
tenebris-prime=○🌐Ajoute une nouvelle planète, Tenebris, une planète sombre enveloppée d'une épaisse atmosphère acide. Fork du mod Tenebris original.

[space-location-name]
tenebris=Tenebris

[space-location-description]
tenebris=Une planète mystérieuse et sombre, perpétuellement plongée dans l’ombre en raison de son atmosphère épaisse absorbant la lumière. La surface est faiblement éclairée par une flore et une faune bioluminescentes qui prospèrent en l’absence de soleil, projetant des lueurs diffuses à travers un paysage teinté de violets et de bleus profonds. Tenebris est un monde hostile et énigmatique, où la technologie et la lumière sont essentielles pour survivre dans l'obscurité perpétuelle.

