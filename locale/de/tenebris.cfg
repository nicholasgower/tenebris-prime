[item-description]
luciferin=Ein biolumineszierendes Pulver, das ein sanftes blaugrünes Leuchten ausstrahlt und für fortschrittliche energie- und lichtbasierte Anwendungen verwendet wird.
lucifunnel=Eine biolumineszierende Pflanze mit zarten, trichterförmigen Blättern, die ein ätherisches blaugrünes Leuchten verströmen. Ihre sich windenden Ranken und verschlungenen Blattmuster erzeugen in der Dunkelheit ein faszinierendes Schauspiel, das an Unterwasserkorallen oder eine außerirdische Flora erinnert. Der Lucifunnel gedeiht in lichtarmen Umgebungen, wo er ein weiches, geisterhaftes Licht ausstrahlt, das nachtaktive Bestäuber anlockt und seine Umgebung mit einer mystischen Aura erhellt.
lucifunnel-seed=Ein seltener, leuchtender Samen, der ein sanftes blaugrünes Leuchten abgibt, unverzichtbar für den Anbau biolumineszenter Pflanzen.
quartz-ore=Ein glänzendes, kristallartiges Mineral, das in robusten, erdigen Ablagerungen zu finden ist und für Handwerks- und Industrieanwendungen geschätzt wird.
quartz-crystal=Ein klarer, glasartiger Kristall mit scharfen Facetten, der für seine Schönheit und Haltbarkeit in Handwerk und Industrie geschätzt wird.
chitin=Ein zähes, geschichtetes Material aus Exoskeletten, bekannt für seine Widerstandsfähigkeit und Haltbarkeit.
tenecap=Ein mattbrauner Pilz.
tenecap-spore=Ein kleines Bündel Sporen, geerntet vom Tenecap-Pilz.
chitosan=Ein veredeltes, leichtes Material, das aus Chitin gewonnen wird und für seine Flexibilität und Haltbarkeit bekannt ist.
biobeacon=Effektverteiler mit biolumineszenter Energie, akzeptiert alle Module, die ein Standard-Effektverteiler akzeptieren kann, zusätzlich zu [item=productivity-module].

