[mod-name]
tenebris-prime=○🌐Tenebris Prime

[mod-description]
tenebris-prime=○🌐Fügt einen neuen Planeten hinzu, Tenebris, einen dunklen Planeten, der von einer dicken, säurehaltigen Atmosphäre umhüllt ist. Fork der ursprünglichen Tenebris-Mod.

[space-location-name]
tenebris=Tenebris

[space-location-description]
tenebris=Ein mysteriöser, dunkler Planet, der aufgrund seiner dichten, lichtabsorbierenden Atmosphäre ständig in Schatten gehüllt ist. Die Oberfläche wird nur spärlich von biolumineszierenden Pflanzen und Tieren beleuchtet, die in Abwesenheit von Sonnenlicht gedeihen und ein schwaches Leuchten über die in Violett- und Blautönen gefärbte Landschaft werfen. Tenebris ist eine raue, rätselhafte Welt, in der Technologie und Licht für das Überleben inmitten der ewigen Finsternis unerlässlich sind.

